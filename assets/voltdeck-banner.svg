<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="VoltDeck — Stay Connected Anywhere">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0A1328"/>
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94B3FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Midnight Canvas & Engineering Grid -->
  <rect x="2" y="2" width="956" height="236" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="236" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="956" height="236" rx="22" fill="url(#glow)"/>
  <rect x="2" y="2" width="956" height="236" rx="22" fill="none" stroke="#94B3FF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Subtle Corner Registration Ticks -->
  <path d="M 24 40 V 24 H 40" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 936 40 V 24 H 920" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 24 200 V 216 H 40" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M 936 200 V 216 H 920" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- VoltDeck Engineer PETIR Emblem -->
  <g transform="translate(150, 120)">
    <!-- Outer Chamfered Octagonal Reticle -->
    <path d="M -38 -62 H 38 L 62 -38 V 38 L 38 62 H -38 L -62 38 V -38 Z" fill="#0B1120" fill-opacity="0.88" stroke="#94B3FF" stroke-opacity="0.24" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#60A5FA" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 5"/>
    <!-- Glowing Electric Blue Orb -->
    <circle cx="0" cy="0" r="38" fill="url(#orb)"/>
    <!-- Crisp Geometric Lightning Bolt -->
    <path d="M 6 -25 L -17 4 H -1 L -7 26 L 18 -4 H 2 Z" fill="url(#bolt)"/>
    <!-- Emerald Live Node -->
    <circle cx="44" cy="44" r="6" fill="#22C55E"/>
    <circle cx="44" cy="44" r="10" fill="#22C55E" fill-opacity="0.22"/>
  </g>

  <!-- Wordmark & Tagline -->
  <g transform="translate(246, 114)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Ubuntu, sans-serif" font-size="54" font-weight="800" letter-spacing="10">VOLTDECK</text>
    <rect x="2" y="16" width="520" height="2" fill="url(#accentLine)"/>
    <text x="2" y="44" fill="#93C5FD" font-family="'JetBrains Mono', 'Ubuntu Mono', ui-monospace, Menlo, monospace" font-size="14" font-weight="600" letter-spacing="4">TRANSFER · CLIPBOARD · LIVE SCREEN · REMOTE DECK</text>
    <text x="2" y="68" fill="#64748B" font-family="'JetBrains Mono', 'Ubuntu Mono', ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">LINUX MINT ↔ iOS / ANY BROWSER  ·  OFFLINE LAN &amp; ANYWHERE VPN</text>
  </g>

  <!-- Status Pill Top-Right -->
  <g transform="translate(766, 30)">
    <rect x="0" y="0" width="144" height="26" rx="13" fill="#0D1426" stroke="#94B3FF" stroke-opacity="0.2"/>
    <circle cx="16" cy="13" r="4" fill="#22C55E"/>
    <text x="28" y="17" fill="#CBD5E1" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1">STAY CONNECTED</text>
  </g>
</svg>
